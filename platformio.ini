; Aero Hand Open firmware for Seeed Studio XIAO ESP32S3.
; Build the right-hand firmware by default. Select left_hand explicitly for a left hand.
[platformio]
default_envs = right_hand

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
lib_deps = https://github.com/ftservo/FTServo_Arduino.git#2.0.0
monitor_speed = 921600

[env:right_hand]
build_flags = -DRIGHT_HAND

[env:left_hand]
build_flags = -DLEFT_HAND
